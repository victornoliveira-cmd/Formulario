<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Pessoal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Cadastro Pessoal</h1>
        <p class="descricao">
            Preencha os dados abaixo para realizar seu cadastro.
        </p>

        <form id="formulario">

            <div class="campo">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" required>
            </div>

            <div class="campo">
                <label for="sobrenome">Sobrenome *</label>
                <input type="text" id="sobrenome" required>
            </div>

            <div class="campo">
                <label for="nascimento">Data de nascimento *</label>
                <input type="date" id="nascimento" required>
            </div>

            <div class="campo">
                <label for="rg">RG *</label>
                <input type="text" id="rg" placeholder="00.000.000-0" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF *</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>
            </div>

            <div class="campo">
                <label for="nacionalidade">Nacionalidade *</label>
                <input type="text" id="nacionalidade" value="Brasileira" required>
            </div>

            <div class="campo">
                <label for="naturalidade">Naturalidade *</label>
                <input type="text" id="naturalidade" placeholder="Cidade/Estado" required>
            </div>

            <div class="campo">
                <label for="altura">Altura (m) *</label>
                <input type="number" id="altura" step="0.01" placeholder="Ex.: 1.75" required>
            </div>

            <div class="campo">
                <label for="peso">Peso (kg) *</label>
                <input type="number" id="peso" step="0.1" placeholder="Ex.: 70" required>
            </div>

            <div class="campo">
                <label for="sexo">sexo</label>
                <select id="sexo">
                    <option value="">Selecione</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="campo campo-completo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="exemplo@email.com">
            </div>

            <button type="submit">Cadastrar</button>

        </form>
    </div>

    <script src="script.js"></script>

</body>
</html>
